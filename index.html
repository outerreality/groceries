<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1013">
<title>Groceries</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Groceries">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0E1013;--card:#171A1F;--line:#22262C;--edge:#2A2F37;--text:#EDEFF3;--muted:#9AA1AD;--dim:#8A919C;--accent:#5EDB9A;--ink:#0E1013;--seg:#2C323B;--chip:#22262C;--warn:#F2B06A;--danger:#FF9A8A;--dangeredge:#4A2A2A;--dangerfill:#3A1E1E;--dangertext:#FFD0C8;--ring:#6B7380;--faint:#474E58;--qn:#5F6670;--swoff:#3A404A;--knob:#C9CED6;--cart:#13161A;--cartline:#1E2127;--pill:#183126}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  button,input,select{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  input::placeholder{color:var(--dim)}
  .app{width:100%;max-width:480px;margin:0 auto;min-height:100vh;padding:calc(20px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px;overflow-x:hidden}
  .hide{display:none!important}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 0}
  .top h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.01em}
  .sub{font-size:14px;color:var(--muted)}
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .carrot{flex:none;display:block}
  .people{display:flex;align-items:center}
  .av{width:32px;height:32px;border-radius:50%;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg)}
  .people .av+.av{margin-left:-8px}
  .av.sm{width:24px;height:24px;font-size:12px;box-shadow:none;flex:none}
  .iconbtn{width:44px;height:44px;flex:none;background:none;border:0;display:flex;align-items:center;justify-content:center;padding:0}
  .card{background:var(--card);border-radius:16px;padding:4px 14px}
  .card.pad{padding:4px 14px 8px}
  .mealhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .mealtoggle{flex:1;min-height:48px;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;text-align:left}
  .mealtoggle b{font-size:15px;font-weight:600}
  .link{background:none;border:0;color:var(--accent);font-size:14px;font-weight:600;min-height:44px;padding:0 4px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 14px}
  .chip{background:var(--chip);border:0;border-radius:999px;padding:0 14px;min-height:40px;font-size:14px}
  .empty{padding:14px 0;font-size:15px;color:var(--muted)}
  .chips .empty{padding:4px 0 2px}
  .addrow{display:flex;gap:8px}
  .addrow .field{flex:1}
  .field{flex:none;min-width:0;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:0 14px;min-height:52px}
  .field input{flex:1;min-width:0;width:100%;background:none;border:0;outline:none;font-size:16px}
  .sq{flex:none;width:52px;min-height:52px;background:var(--card);border:1px solid var(--edge);border-radius:14px;display:flex;align-items:center;justify-content:center}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .ctrl{position:relative}
  .ingctrl{position:relative}
  .suggest{position:absolute;left:0;right:0;bottom:calc(100% + 8px);z-index:20;display:flex;flex-direction:column-reverse;border:1px solid var(--edge);box-shadow:0 -8px 28px rgba(0,0,0,.35)}
  .sugg{width:100%;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);padding:0;text-align:left;font-size:16px}
  .sugg:first-child{border-bottom:0}
  .tag{font-size:13px;color:var(--muted);flex:none}
  .tag.go{color:var(--accent);font-weight:600}
  .seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--card);border-radius:12px;padding:4px}
  .seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  .seg button{min-height:44px;border:0;border-radius:9px;background:none;color:var(--muted);font-size:15px;font-weight:500}
  .seg button.on{background:var(--seg);color:var(--text);font-weight:600}
  .ctrl{display:flex;align-items:center;gap:8px;margin-top:-4px}
  .ctrlbtns{display:flex;gap:8px;margin-left:auto;flex:none}
  .sq.sm{width:46px;min-height:46px;border-radius:12px}
  .addfield{flex:1;min-width:0;display:flex}
  .addfield .field{flex:1;min-height:46px;padding-right:4px}
  .ctrl.adding #seg,.ctrl.adding #addOpenBtn{display:none}
  .ctrl:not(.adding) .addfield{display:none}
  .xbtn{flex:none;width:40px;height:40px;background:none;border:0;display:flex;align-items:center;justify-content:center;padding:0}
  .qty{display:flex;align-items:center;flex:none;margin-right:-8px}
  .qb{width:36px;height:48px;background:none;border:0;display:flex;align-items:center;justify-content:center;padding:0}
  .qb svg{stroke:var(--faint)!important;transition:stroke .2s}
  .qty.hot .qb svg{stroke:var(--text)!important}
  .qty.hot .qb.up svg{stroke:var(--accent)!important}
  .qb:disabled{opacity:.4}
  .rmpill{flex:none;min-height:36px;margin:8px 0;padding:0 16px;border-radius:999px;border:1px solid var(--dangeredge);background:var(--dangerfill);color:var(--dangertext);font-size:14px;font-weight:600}
  .qn{min-width:18px;text-align:center;font-size:14px;color:var(--qn);transition:color .2s}
  .qn.many{color:var(--muted);font-weight:600}
  .qty.hot .qn{color:var(--text)}
  .themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:12px 0 8px}
  .theme{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:6px 0;font-size:12px;color:var(--muted)}
  .theme .dot{width:44px;height:44px;border-radius:50%;border:2px solid var(--edge);display:flex;align-items:center;justify-content:center;position:relative}
  .theme .dot i{width:16px;height:16px;border-radius:50%}
  .theme.on{color:var(--text);font-weight:600}
  .theme.on .dot{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--accent)}
  .custom{border-top:1px solid var(--line);padding:12px 0 14px;display:flex;flex-direction:column;gap:12px}
  .custom h4{margin:0;font-size:14px;font-weight:600}
  .pickers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .picker{display:flex;align-items:center;gap:10px;min-height:52px;background:var(--bg);border:1px solid var(--edge);border-radius:12px;padding:0 10px;font-size:14px}
  .picker input{width:32px;height:32px;border:0;padding:0;background:none;border-radius:8px;flex:none}
  .picker input::-webkit-color-swatch-wrapper{padding:0}
  .picker input::-webkit-color-swatch{border:1px solid var(--edge);border-radius:8px}
  .seg.sm.three-sm{grid-template-columns:repeat(3,auto);flex:none;white-space:nowrap}
  .textrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
  .setrow{margin:0;min-height:52px;color:var(--text);font-size:16px}
  .seg.sm{display:inline-grid;grid-template-columns:auto auto;gap:2px;padding:3px;border-radius:11px}
  .seg.sm button{min-height:40px;padding:0 16px;font-size:14px;border-radius:8px}
  .switchrow.sm{width:auto;margin:0 0 0 auto;gap:10px;min-height:44px;padding:0 2px}
  .savebtn{flex:none;min-height:52px;padding:0 22px;border:0;border-radius:14px;background:var(--accent);color:var(--ink);font-size:16px;font-weight:700}
  .switchrow{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin:-10px 0 -6px;padding:0 4px;background:none;border:0;color:var(--muted);font-size:14px;width:100%}
  .sw{width:40px;height:24px;border-radius:999px;background:var(--swoff);display:flex;align-items:center;padding:2px;justify-content:flex-start}
  .sw i{width:20px;height:20px;border-radius:50%;background:var(--knob)}
  .sw.on{background:var(--accent);justify-content:flex-end}
  .sw.on i{background:var(--ink)}
  .sechead{display:flex;align-items:center;justify-content:space-between;padding:16px 0 6px}
  .sechead h3{margin:0;font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
  .sechead.grey h3{color:var(--muted)}
  .sechead span{font-size:13px;color:var(--muted)}
  .row{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
  .sechead+.row,.card>.row:first-child{border-top:0}
  .rowmain{flex:1;min-width:0;min-height:52px;display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;text-align:left}
  .circle{width:22px;height:22px;border-radius:50%;border:2px solid var(--ring);flex:none}
  .nm{font-size:16px;display:flex;flex-direction:column;gap:2px;padding:6px 0;min-width:0}
  .nm small{font-size:13px;color:var(--muted)}
  .stepper{display:flex;align-items:center;gap:2px;background:var(--chip);border-radius:999px;padding:3px;flex:none}
  .stepper .sb{width:38px;height:38px;border-radius:50%;border:0;background:var(--seg);display:flex;align-items:center;justify-content:center}
  .stepper .sn{min-width:44px;height:38px;border:0;background:none;text-align:center;font-size:15px;font-weight:600;padding:0 4px}
  .cart{background:var(--cart);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
  .cart .row{border-top-color:var(--cartline)}
  .cart .rowmain{min-height:48px;color:var(--dim)}
  .cart .nm{text-decoration:line-through}
  .done{width:22px;height:22px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
  .head2{display:flex;align-items:center;gap:6px;padding-top:2px}
  .head2 h1{margin:0;font-size:24px;font-weight:700}
  .head2 .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .head2 .iconbtn:first-child{margin-left:-10px}
  .pill{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent);background:var(--pill);border-radius:999px;padding:5px 10px 5px 8px;flex:none}
  .plus{width:30px;height:30px;border-radius:50%;border:2px solid var(--ring);display:flex;align-items:center;justify-content:center;flex:none}
  .listbtn{width:100%;min-height:52px;display:flex;align-items:center;gap:12px;background:none;border:0;border-top:1px solid var(--line);padding:0;text-align:left}
  .sechead+.listbtn,.card>.listbtn:first-child{border-top:0}
  .listbtn .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:16px;padding:6px 0}
  .listbtn .grow small{font-size:13px;color:var(--muted)}
  .listbtn .grow small.warn{color:var(--warn)}
  .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--ring);flex:none}
  .box.on{border:0;background:var(--accent);display:flex;align-items:center;justify-content:center}
  .big{min-height:52px;border:0;border-radius:14px;background:var(--accent);color:var(--ink);font-size:16px;font-weight:700;width:100%}
  .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .ghost{min-height:52px;border:1px solid var(--edge);border-radius:14px;background:var(--card);font-size:15px;font-weight:600}
  .ghost.danger{border-color:var(--dangeredge);color:var(--danger)}
  .ghost.armed{background:var(--dangerfill);color:var(--dangertext)}
  .editor{border-top:1px solid var(--line);padding:12px 0 14px;display:flex;flex-direction:column;gap:10px}
  .sechead+.editor{border-top:0}
  .editor input,.editor select{width:100%;min-height:48px;background:var(--bg);border:1px solid var(--edge);border-radius:12px;padding:0 12px;font-size:16px;outline:none}
  .editor select{appearance:none;-webkit-appearance:none}
  .editor .btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .editor .btns button{min-height:44px;border-radius:12px;border:1px solid var(--edge);background:var(--card);font-size:14px;font-weight:600}
  .editor .btns .save{background:var(--accent);border-color:var(--accent);color:var(--ink)}
  .editor .btns .del{color:var(--danger);border-color:var(--dangeredge)}
  .editor .btns .del.armed{background:var(--dangerfill);color:var(--dangertext)}
  .secrow{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);min-height:52px}
  .card>.secrow:first-child{border-top:0}
  .secrow span{flex:1;font-size:16px}
  .secrow .num{flex:none;width:28px;color:var(--muted);font-size:14px}
  .arrow{width:44px;height:44px;border-radius:12px;border:0;background:var(--chip);display:flex;align-items:center;justify-content:center}
  .arrow:disabled{opacity:.3}
  .mealrow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
  .card>.mealrow:first-child{border-top:0}
  .mealrow .listbtn{border-top:0;flex:1;min-width:0}
  .mealedit{flex:none;min-height:52px;padding:0 4px 0 12px}
  .totop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;width:46px;height:46px;border-radius:50%;border:1px solid var(--edge);background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.35);padding:0}
  body.topbtn .status{bottom:calc(74px + env(safe-area-inset-bottom))}
  .status{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);border:0;max-width:92vw;text-align:center;background:var(--dangerfill);color:var(--dangertext);font-size:13px;padding:8px 14px;border-radius:999px;}
  .loading{padding:80px 0;text-align:center;color:var(--muted);font-size:15px}
  .namebtn{width:100%;min-height:56px;display:flex;align-items:center;gap:12px;background:none;border:0;border-top:1px solid var(--line);padding:0;font-size:17px;text-align:left}
  .card>.namebtn:first-child{border-top:0}
  .stickybar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;padding-top:4px}
</style>
</head>
<body>
<main class="app" id="app"><div class="loading">Loading Your List…</div></main>
<button class="totop hide" id="toTop" data-act="toTop" aria-label="Back To Top"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke:var(--text)"><path d="M12 19V6M6 11l6-6 6 6"/></svg></button>
<button class="status hide" id="status" data-act="retry">Offline · Changes Will Sync</button>

<script>
var GL = (function GL_FACTORY_() {

  function copy(o) { return JSON.parse(JSON.stringify(o)); }

  function titleCase(s) {
    return String(s || '').trim().replace(/\s+/g, ' ').split(' ').map(function (w) {
      if (!w) { return w; }
      var i = 0;
      while (i < w.length && !/[A-Za-z0-9]/.test(w.charAt(i))) { i++; }
      return w.slice(0, i) + w.charAt(i).toUpperCase() + w.slice(i + 1);
    }).join(' ');
  }

  function norm(s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); }

  // "Limes 6", "6 Limes", "Limes x6", "6x Limes" -> { name, qty }
  function parseAdd(text) {
    var t = String(text || '').trim().replace(/\s+/g, ' ');
    var m, qty = 1;
    if ((m = t.match(/^(\d{1,3})\s*[xX]?\s+(.+)$/))) { qty = parseInt(m[1], 10); t = m[2]; }
    else if ((m = t.match(/^(.+?)\s+[xX]?\s*(\d{1,3})$/))) { qty = parseInt(m[2], 10); t = m[1]; }
    if (!qty || qty < 1) { qty = 1; }
    return { name: titleCase(t), qty: qty };
  }

  var GUESS = [
    ['Frozen', ['frozen', 'ice cream', 'popsicle']],
    ['Personal Care', ['shampoo', 'conditioner', 'toothpaste', 'toothbrush', 'deodorant', 'floss', 'razor', 'lotion', 'sunscreen', 'body soap', 'hand soap', 'q tips', 'tampon', 'vitamin']],
    ['Household', ['cleaner', 'detergent', 'paper towel', 'toilet paper', 'trash', 'garbage', 'foil', 'plastic wrap', 'sponge', 'bags', 'batteries', 'bulb', 'dish soap', 'dryer', 'napkin', 'kleenex', 'tissue']],
    ['Pets', ['cat ', 'dog ', 'litter', 'pet ']],
    ['Spices', ['powder', 'cumin', 'paprika', 'oregano', 'cinnamon', 'nutmeg', 'cardamom', 'seasoning', 'spice', 'peppercorn', 'salt']],
    ['Oils', ['oil', 'vinegar', 'ketchup', 'mustard', 'mayo', 'dressing', 'hot sauce', 'syrup', 'jam', 'jelly', 'honey']],
    ['International', ['soy sauce', 'tamari', 'miso', 'nori', 'curry paste', 'fish sauce', 'sriracha', 'gochujang', 'rice paper', 'kimchi']],
    ['Canned/Jarred', ['canned', 'can ', 'beans', 'broth', 'stock', 'tomato sauce', 'tomatoes (', 'salsa', 'pickle', 'olives']],
    ['Grains/Pasta/Dried', ['rice', 'pasta', 'noodle', 'spaghetti', 'quinoa', 'oats', 'oatmeal', 'cereal', 'lentil', 'couscous', 'barley']],
    ['Baking', ['flour', 'sugar', 'baking', 'yeast', 'vanilla', 'chocolate chips', 'cocoa']],
    ['Snacks', ['chips', 'crackers', 'cookies', 'nuts', 'almonds', 'pretzels', 'popcorn', 'granola bar', 'candy', 'trail mix']],
    ['Beverages', ['juice', 'soda', 'water', 'coffee', 'tea', 'kombucha', 'beer', 'wine', 'sparkling']],
    ['Dairy', ['milk', 'cheese', 'yogurt', 'butter', 'cream', 'eggs', 'sour cream']],
    ['Meat Alternatives', ['tofu', 'tempeh', 'seitan', 'vegan', 'plant based', 'beyond', 'impossible']],
    ['Meat', ['chicken', 'beef', 'pork', 'turkey', 'sausage', 'bacon', 'ham', 'steak', 'fish', 'salmon', 'shrimp']],
    ['Bakery', ['bread', 'bagel', 'bun', 'roll', 'muffin', 'croissant', 'pita', 'naan', 'tortilla']],
    ['Produce', ['apple', 'banana', 'orange', 'lemon', 'lime', 'berr', 'grape', 'melon', 'pear', 'peach', 'plum', 'mango', 'pineapple', 'kiwi', 'avocado', 'lettuce', 'spinach', 'kale', 'arugula', 'cabbage', 'carrot', 'celery', 'onion', 'garlic', 'ginger', 'potato', 'tomato', 'pepper', 'cucumber', 'zucchini', 'squash', 'broccoli', 'cauliflower', 'mushroom', 'herb', 'basil', 'parsley', 'cilantro', 'mint', 'corn', 'beet', 'radish', 'leek', 'asparagus', 'sprout']]
  ];

  function guessSection(name, sections) {
    var n = ' ' + norm(name) + ' ';
    for (var i = 0; i < GUESS.length; i++) {
      var sec = GUESS[i][0], words = GUESS[i][1];
      if (sections.indexOf(sec) === -1) { continue; }
      for (var j = 0; j < words.length; j++) {
        if (n.indexOf(words[j]) !== -1) { return sec; }
      }
    }
    return sections.indexOf('Other') !== -1 ? 'Other' : sections[sections.length - 1];
  }

  function findByName(st, name) {
    var n = norm(name);
    var ids = Object.keys(st.items);
    for (var i = 0; i < ids.length; i++) { if (norm(st.items[ids[i]].name) === n) { return ids[i]; } }
    return null;
  }

  // Also matches "Lime" when you type "Limes" (and the other way round).
  function findLoose(st, name) {
    var n = norm(name);
    return findByName(st, n) ||
      (/es$/.test(n) ? findByName(st, n.slice(0, -2)) : null) ||
      (/s$/.test(n) ? findByName(st, n.slice(0, -1)) : null) ||
      findByName(st, n + 's') || findByName(st, n + 'es');
  }

  function ingN(meal, id) {
    for (var i = 0; i < meal.ing.length; i++) { if (meal.ing[i][0] === id) { return meal.ing[i][1]; } }
    return 0;
  }

  // How many of each item are on the list right now.
  function totals(st) {
    var t = {};
    Object.keys(st.manual).forEach(function (id) { t[id] = (t[id] || 0) + st.manual[id]; });
    Object.keys(st.active).forEach(function (mid) {
      var meal = st.meals[mid];
      if (!meal) { return; }
      Object.keys(st.active[mid]).forEach(function (id) { t[id] = (t[id] || 0) + ingN(meal, id); });
    });

    code = String(code || '').trim();

    } catch (e) {}

  }

  // A setup link (…/groceries/#setup=CODE) saves the connection, then hides the code from the address bar.
  var hm = location.hash.match(/setup=([A-Za-z0-9_-]+)/);
  if (hm) {
    var fromLink = decode(hm[1]);
    if (fromLink) { try { localStorage.setItem(CFG, JSON.stringify(fromLink)); } catch (e) {} }
    history.replaceState(null, '', location.pathname + location.search);
  }
  var cfg = readCfg();
  // Lets the app forget its connection (from the loading screen) so a new setup link or code can be used.
  window.APP_RESET = function () { try { localStorage.removeItem(CFG); } catch (e) {} location.reload(); };
  // A setup link opened while the app is already showing: start over with it.
  window.addEventListener('hashchange', function () { if (/setup=/.test(location.hash)) { location.reload(); } });

      cache: 'no-store',

      return '<div class="head2"><button class="iconbtn" data-act="picker" aria-label="Back To Meals">' + I.back + '</button>' +
        '<div class="grow"><h1 id="addTitle"></h1><div class="sub">Untick Anything You Already Have</div></div></div>' +
        '<div class="card" id="addRows"></div><div class="stickybar"><button class="big" data-act="confirmAdd" id="addBtn"></button>' +
        '<button class="link" data-act="editIng" data-from="addMeal">Edit Ingredients</button></div>';

    if (screen === 'meal') {
      return '<div class="head2"><button class="iconbtn" data-act="home" aria-label="Back To List">' + I.back + '</button>' +
        '<div class="grow"><h1 id="viewTitle"></h1><div class="sub">This Week\'s Meal</div></div></div>' +
        '<div class="card" id="viewRows"></div><div class="two"><button class="ghost" data-act="editIng" data-from="meal">Edit Ingredients</button>' +
        '<button class="ghost danger" data-act="removeMeal" id="removeMealBtn"></button></div>';

    if (screen === 'ing') {
      return '<div class="head2"><button class="iconbtn" data-act="ingBack" aria-label="Back">' + I.back + '</button><div class="grow"><h1>Edit Meal</h1></div></div>' +
        '<div class="addrow"><label class="field"><span class="sr">Meal Name</span><input id="ingName" type="text" placeholder="Meal Name" autocomplete="off" autocapitalize="words"></label>' +
        '<button class="savebtn" data-act="saveIng">Save</button></div>' +
        '<div class="card pad" id="ingChosen"></div>' +
        '<div class="ingctrl" id="ingCtrl"><label class="field">' + I.search + '<span class="sr">Find Ingredients</span><input id="ingSearch" type="text" placeholder="Find Ingredients" autocomplete="off" autocapitalize="words" enterkeyhint="done"></label>' +
        '<div class="card suggest hide" id="ingSuggest"></div></div>' +
        '<div class="card pad" id="ingAll"></div>' +
        '<button class="ghost danger" data-act="deleteMeal" id="deleteMealBtn"></button>';
    }
    if (screen === 'settings') {
      return '<div class="head2"><button class="iconbtn" data-act="home" aria-label="Back To List">' + I.back + '</button><div class="grow"><h1>Settings</h1></div></div>' +
        '<div class="card"><button class="namebtn" data-act="changeName"><span style="flex:1">This Phone Belongs To <b id="meName"></b></span><span class="tag go">Change</span></button></div>' +
        '<div class="card" id="secToggle"></div>' +
        '<div class="sechead" style="padding:4px 4px 0"><h3>Colors</h3></div><div class="sub" style="margin-top:-12px;padding:0 4px">Only Changes This Phone</div>' +
        '<div class="card" id="themeCard"></div>' +
        '<div class="sechead" style="padding:4px 4px 0"><h3>Sync Details</h3></div><div class="card" id="syncLog"></div>' +
        '<div class="sechead" style="padding:4px 4px 0"><h3>Store Order</h3></div><div class="sub" style="margin-top:-12px;padding:0 4px">Move Sections Into The Order You Walk The Store. Items Inside Each Section Learn Their Order As You Shop.</div>' +
        '<div class="card" id="secList"></div>';
    }
    return '';
  }

  function render(soft) {
    if (!st) { return; }
    var screen = me ? ui.screen : 'name';
    if (soft && document.activeElement && document.activeElement.closest && document.activeElement.closest('.editor')) { return; }
    if (built !== screen) {
      $('app').innerHTML = shell(screen);
      built = screen;
      bindInputs(screen);
    }
    ({ name: rName, main: rMain, all: rAll, picker: rPicker, addMeal: rAddMeal, meal: rMeal, ing: rIng, settings: rSettings }[screen] || function () {})();
  }

  function bindInputs(screen) {
    if (screen === 'name') {
      $('nameForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var n = GL.titleCase($('nameInput').value);
        if (n) { chooseName(n); }
      });
    }
    if (screen === 'main') {
      var inp = $('addInput');
      inp.value = ui.addText;
      inp.addEventListener('input', function () { ui.addText = inp.value; rSuggest(); });
      // Tapping away from an empty add field tucks it back in.
      inp.addEventListener('blur', function () {
        setTimeout(function () {
          if (ui.addOpen && !inp.value && document.activeElement !== inp) { ui.addOpen = false; render(); }
        }, 200);
      });
      $('addForm').addEventListener('submit', function (e) {
        e.preventDefault();
        addTyped(inp.value);
        inp.value = ''; ui.addText = '';
        rSuggest();
      });
    }
    if (screen === 'all') {
      var s = $('search');
      s.value = ui.search;
      s.addEventListener('input', function () { ui.search = s.value; rAll(); });
    }
    if (screen === 'picker') {
      var m = $('mealSearch');
      m.value = ui.mealSearch;
      m.addEventListener('input', function () { ui.mealSearch = m.value; rPicker(); });
      m.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); var b = document.querySelector('[data-act="newMeal"]'); if (b) { b.click(); } }
      });
    }
    if (screen === 'ing') {
      var n = $('ingName'), q = $('ingSearch');
      n.value = ui.ingName; q.value = ui.ingSearch;
      n.addEventListener('input', function () { ui.ingName = n.value; });
      q.addEventListener('input', function () { ui.ingSearch = q.value; rIngSuggest(); });
      // Bring the field up near the top so the matches have room above it, clear of the keyboard.
      q.addEventListener('focus', function () {
        var top = q.getBoundingClientRect().top + window.scrollY - 300;
        if (Math.abs(window.scrollY - top) > 20) { window.scrollTo(0, Math.max(0, top)); }
      });
      q.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); var first = document.querySelector('#ingSuggest .sugg'); if (first) { first.click(); } }
      });
    }
  }

  /* --- name --- */
  function rName() {
    $('nameList').innerHTML = st.users.length ? st.users.map(function (u) {
      return '<button class="namebtn" data-act="pickName" data-name="' + esc(u) + '">' + avatar(u) + '<span>' + esc(u) + '</span></button>';
    }).join('') : '<div class="empty">No One Has Picked A Name Yet. Type Yours Below.</div>';
  }
  function chooseName(n) {
    me = n; lsSet('me', n);
    setUrlName(n);
    loadPrefs();
    if (st.users.indexOf(n) === -1) { send({ type: 'addUser', name: n }); }
    built = null; ui.screen = 'main'; render();
  }

  /* --- main --- */
  function rowHtml(x, az) {
    var right = ui.rmArmed === x.id
      ? '<button class="rmpill" data-act="rmItem" data-id="' + x.id + '" aria-label="Tap Again To Remove ' + esc(x.name) + '">Remove</button>'
      : '<div class="qty' + (ui.hot === x.id ? ' hot' : '') + '">' +
      '<button class="qb" data-act="dec" data-id="' + x.id + '" aria-label="' + (x.n <= 1 ? 'Remove ' : 'One Less ') + esc(x.name) + '">' + I.dec + '</button>' +
      '<span class="qn' + (x.n > 1 ? ' many' : '') + '">' + x.n + '</span>' +
      '<button class="qb up" data-act="inc" data-id="' + x.id + '" aria-label="One More ' + esc(x.name) + '">' + I.incG + '</button></div>';
    return '<div class="row"><button class="rowmain" data-act="check" data-id="' + x.id + '"><span class="circle" aria-hidden="true"></span>' +
      '<span class="nm"><span>' + esc(x.name) + '</span>' + (az ? '<small>' + esc(x.sec) + '</small>' : '') + '</span></button>' + right + '</div>';
  }

  function rMain() {
    var all = itemsOnList();
    var toGet = all.filter(function (x) { return !st.checked[x.id]; });
    var inCart = all.filter(function (x) { return st.checked[x.id]; }).sort(function (a, b) { return st.checked[a.id].t - st.checked[b.id].t; });

    $('counts').textContent = toGet.length + ' To Get · ' + inCart.length + ' In Cart';
    $('people').innerHTML = st.users.map(function (u) { return avatar(u); }).join('');

    var meals = st.mealOrder.filter(function (m) { return st.active[m] && st.meals[m]; });
    $('mealCount').textContent = meals.length;
    $('mealChev').innerHTML = prefs.mealsOpen ? I.down : I.right;
    $('mealToggle').setAttribute('aria-expanded', prefs.mealsOpen ? 'true' : 'false');
    var chips = $('mealChips');
    chips.classList.toggle('hide', !prefs.mealsOpen);
    chips.innerHTML = meals.length ? meals.map(function (m) {
      return '<button class="chip" data-act="openMeal" data-id="' + m + '">' + esc(st.meals[m].name) + '</button>';
    }).join('') : '<div class="empty">No Meals Planned Yet</div>';

    rSuggest();

    $('seg').innerHTML = '<button data-act="mode" data-mode="store" class="' + (prefs.mode === 'store' ? 'on' : '') + '">Store Order</button>' +
      '<button data-act="mode" data-mode="az" class="' + (prefs.mode === 'az' ? 'on' : '') + '">A–Z</button>';
    $('ctrl').classList.toggle('adding', !!ui.addOpen);

    var html = '';
    if (!toGet.length) {
      html = '<div class="card"><div class="empty">' + (inCart.length ? 'Everything Is In The Cart' : 'Nothing On The List Yet') + '</div></div>';
    } else if (prefs.mode === 'az') {
      html = '<div class="card">' + toGet.sort(byName).map(function (x) { return rowHtml(x, true); }).join('') + '</div>';
    } else if (!prefs.headings) {
      html = '<div class="card">' + storeSort(toGet).map(function (x) { return rowHtml(x); }).join('') + '</div>';
    } else {
      storeSort(toGet);
      html = '<div class="card pad">';
      st.sections.forEach(function (sec) {
        var g = toGet.filter(function (x) { return x.sec === sec; });
        if (!g.length) { return; }
        html += '<div class="sechead"><h3>' + esc(sec) + '</h3><span>' + g.length + '</span></div>' + g.map(function (x) { return rowHtml(x); }).join('');
      });
      html += '</div>';
    }
    $('list').innerHTML = html;

    $('cart').innerHTML = inCart.length ? '<section class="cart"><div class="sechead grey" style="padding:6px 0 2px"><h3>In Cart · ' + inCart.length + '</h3>' +
      '<button class="link" data-act="clear">' + (armed('clear') ? 'Tap Again To Clear' : 'Clear') + '</button></div>' +
      inCart.map(function (x) {
        return '<div class="row"><button class="rowmain" data-act="check" data-id="' + x.id + '"><span class="done" aria-hidden="true">' + I.check + '</span>' +
          '<span class="nm">' + esc(x.name) + (x.n > 1 ? ' · ' + x.n : '') + '</span></button>' + avatar(st.checked[x.id].by, true) + '</div>';
      }).join('') + '</section>' : '';
  }

  /* Search ranking: the exact name first ("Onion" before "Green Onion"), then names that start with what you typed,
     then names with a word that starts with it, then anything containing it. Ties go to what you buy most, then shorter names. */
  function matchScore(name, q) {
    var n = GL.norm(name);
    if (n === q || n === q + 's' || n === q + 'es' || n + 's' === q || n + 'es' === q) { return 0; }
    if (n.indexOf(q) === 0) { return 1; }
    if ((' ' + n.replace(/[()\-–,]/g, ' ')).indexOf(' ' + q) !== -1) { return 2; }
    if (n.indexOf(q) !== -1) { return 3; }
    return -1;
  }
  function rankItems(ids, q) {
    var counts = st.counts || {};
    return ids.map(function (id) { return { id: id, s: matchScore(st.items[id].name, q) }; })
      .filter(function (x) { return x.s >= 0; })
      .sort(function (a, b) {
        var A = st.items[a.id].name, B = st.items[b.id].name;
        return a.s - b.s || (counts[b.id] || 0) - (counts[a.id] || 0) || A.length - B.length || A.localeCompare(B);
      }).map(function (x) { return x.id; });
  }

  function rSuggest() {
    var box = $('suggest');
    if (!box) { return; }
    var q = GL.norm(GL.parseAdd(ui.addText).name);
    if (!q) { box.classList.add('hide'); box.innerHTML = ''; return; }
    var ids = rankItems(Object.keys(st.items), q);
    // Fit as many as there's room for above the add field (it sits near the top, clear of the keyboard).
    var room = Math.floor(($('ctrl').getBoundingClientRect().top - 16) / 49);
    ids = ids.slice(0, Math.max(2, Math.min(5, room)));
    if (!ids.length) { box.classList.add('hide'); box.innerHTML = ''; return; }
    box.classList.remove('hide');
    box.innerHTML = ids.map(function (id) {
      var on = T[id] && !st.checked[id];
      return '<button class="sugg" type="button" data-act="sugg" data-id="' + id + '"><span>' + esc(st.items[id].name) + '</span>' +
        '<span class="tag' + (on ? '' : ' go') + '">' + (on ? 'On List · Add 1 More' : 'Add') + '</span></button>';
    }).join('');
  }

  function addTyped(text) {
    var p = GL.parseAdd(text);
    if (!p.name) { return; }
    var existing = GL.findLoose(st, p.name);
    var id = existing || uid('i');
    send({ type: 'add', id: id, name: p.name, qty: p.qty });
    render();
  }

  /* --- all items --- */
  function rAll() {
    var on = Object.keys(T).length;
    $('allSub').textContent = Object.keys(st.items).length + ' Items · ' + on + ' On List';
    $('allEditBtn').textContent = ui.allEdit ? 'Done' : 'Edit';
    var q = GL.norm(ui.search);
    var html = '', addRow = '';
    if (q && !GL.findByName(st, ui.search)) {
      addRow = '<div class="card"><button class="listbtn" data-act="addSearch"><span class="grow">Add “' + esc(GL.titleCase(ui.search)) + '”<small>New Item · ' +
        esc(GL.guessSection(ui.search, st.sections)) + '</small></span><span class="plus" aria-hidden="true">' + I.plusW + '</span></button></div>';
    }
    var any = false;
    var body = '';
    var counts = st.counts || {};
    var sortBtn = function (key, label) {
      return '<button data-act="allSort" data-sort="' + key + '" class="' + (prefs.allSort === key ? 'on' : '') + '">' + label + '</button>';
    };
    $('allSeg').innerHTML = sortBtn('most', 'Most Bought') + sortBtn('az', 'A–Z') + sortBtn('section', 'By Section');
    var itemRow = function (x, sub) {
      if (ui.allEdit && ui.itemEdit === x.id) { return editorHtml(x.id); }
      var right = ui.allEdit ? '<span class="tag go">Edit</span>'
        : (T[x.id] ? '<span class="pill">' + I.checkG + 'On List</span>' : '<span class="plus" aria-hidden="true">' + I.plusW + '</span>');
      return '<button class="listbtn" data-act="' + (ui.allEdit ? 'itemEdit' : 'toggleList') + '" data-id="' + x.id + '"><span class="grow">' + esc(x.name) +
        (sub ? '<small>' + sub + '</small>' : '') + '</span>' + right + '</button>';
    };
    if (prefs.allSort === 'most' || prefs.allSort === 'az') {
      var most = prefs.allSort === 'most';
      var flat = Object.keys(st.items).filter(function (id) { return !q || GL.norm(st.items[id].name).indexOf(q) !== -1; })
        .map(function (id) { return { id: id, name: st.items[id].name, c: counts[id] || 0 }; })
        .sort(function (a, b) { return (most ? b.c - a.c : 0) || a.name.localeCompare(b.name); });
      if (flat.length) {
        any = true;
        body = flat.map(function (x) {
          return itemRow(x, most ? (x.c ? 'Bought ' + x.c + (x.c === 1 ? ' Time' : ' Times') : 'Not Bought Yet') : '');
        }).join('');
      }
    } else st.sections.forEach(function (sec) {
      var g = Object.keys(st.items).filter(function (id) {
        return st.items[id].sec === sec && (!q || GL.norm(st.items[id].name).indexOf(q) !== -1);
      }).map(function (id) { return { id: id, name: st.items[id].name }; }).sort(byName);
      if (!g.length) { return; }
      any = true;
      body += '<div class="sechead"><h3>' + esc(sec) + '</h3><span>' + g.length + '</span></div>';
      body += g.map(function (x) { return itemRow(x); }).join('');
    });
    html += (any ? '<div class="card pad">' + body + '</div>' : '') + addRow;
    if (!any && !addRow) { html = '<div class="card"><div class="empty">No Matches</div></div>'; }
    $('allList').innerHTML = html;
  }

  function editorHtml(id) {
    var it = st.items[id];
    return '<div class="editor"><label><span class="sr">Item Name</span><input id="editName" type="text" value="' + esc(it.name) + '" autocapitalize="words"></label>' +
      '<label><span class="sr">Section</span><select id="editSec">' + st.sections.map(function (s) {
        return '<option' + (s === it.sec ? ' selected' : '') + '>' + esc(s) + '</option>';
      }).join('') + '</select></label>' +
      '<div class="btns"><button class="del' + (armed('del' + id) ? ' armed' : '') + '" data-act="itemDelete" data-id="' + id + '">' + (armed('del' + id) ? 'Tap Again' : 'Delete') + '</button>' +
      '<button data-act="itemCancel">Cancel</button><button class="save" data-act="itemSave" data-id="' + id + '">Save</button></div></div>';
  }

  /* --- meals --- */
  function rPicker() {
    var q = GL.norm(ui.mealSearch);
    var ids = Object.keys(st.meals).filter(function (m) { return !st.active[m] && (!q || matchScore(st.meals[m].name, q) >= 0); })
      .sort(function (a, b) {
        var A = st.meals[a].name, B = st.meals[b].name;
        return (q ? matchScore(A, q) - matchScore(B, q) || A.length - B.length : 0) || A.localeCompare(B);
      });
    var html = '', addRow = '';
    if (q && !GL.findMealByName(st, ui.mealSearch)) {
      addRow = '<button class="listbtn" data-act="newMeal"><span class="grow">Add “' + esc(GL.titleCase(ui.mealSearch)) + '”<small>New Meal For This Week</small></span><span class="plus" aria-hidden="true">' + I.plusW + '</span></button>';
    }
    html += ids.map(function (m) {
      var n = st.meals[m].ing.length;
      return '<div class="mealrow"><button class="listbtn" data-act="pickMeal" data-id="' + m + '"><span class="grow">' + esc(st.meals[m].name) +
        '<small>' + (n ? n + (n === 1 ? ' Ingredient' : ' Ingredients') : 'No Ingredients Yet') + '</small></span></button>' +
        '<button class="link mealedit" data-act="editMeal" data-id="' + m + '" aria-label="Edit ' + esc(st.meals[m].name) + '">Edit</button></div>';
    }).join('') + addRow;
    if (!html) { html = '<div class="empty">' + (q ? 'Already On This Week\'s List' : 'Every Saved Meal Is On This Week\'s List') + '</div>'; }
    $('savedMeals').innerHTML = html;
  }

  function rAddMeal() {
    var meal = st.meals[ui.addMealId];
    if (!meal) { go('picker'); return; }
    $('addTitle').textContent = 'Add ' + meal.name;
    var count = 0;
    $('addRows').innerHTML = meal.ing.map(function (p) {
      var id = p[0], n = p[1], on = !!ui.ticks[id], have = (T[id] && !st.checked[id]) ? T[id] : 0;
      if (on) { count++; }
      var note = have && on ? 'On List · ' + have + ' → ' + (have + n) : (have ? 'Already On List' : '');
      return '<button class="listbtn" data-act="tick" data-id="' + id + '" role="checkbox" aria-checked="' + on + '">' +
        '<span class="box' + (on ? ' on' : '') + '" aria-hidden="true">' + (on ? I.check : '') + '</span>' +
        '<span class="grow">' + esc(st.items[id].name) + (note ? '<small class="warn">' + note + '</small>' : '') + '</span>' +
        '<span class="tag">' + (n > 1 ? n : '') + '</span></button>';
    }).join('');
    $('addBtn').textContent = 'Add To List · ' + count + (count === 1 ? ' Item' : ' Items');
  }

  function rMeal() {
    var meal = st.meals[ui.viewMealId];
    if (!meal || !st.active[ui.viewMealId]) { go('main'); return; }
    $('viewTitle').textContent = meal.name;
    var chosen = st.active[ui.viewMealId];
    $('viewRows').innerHTML = meal.ing.length ? meal.ing.map(function (p) {
      var id = p[0];
      var s = !chosen[id] ? 'Not Added' : (st.checked[id] ? 'In Cart' : 'On List');
      return '<div class="row"><span class="nm" style="flex:1;min-height:52px;justify-content:center">' + esc(st.items[id].name) + '</span><span class="tag">' + s + '</span></div>';
    }).join('') : '<div class="empty">No Ingredients Saved For This Meal</div>';
    $('removeMealBtn').textContent = armed('rm') ? 'Tap Again' : 'Remove From Week';
    $('removeMealBtn').classList.toggle('armed', armed('rm'));
  }

  function openIng(mealId, from) {
    var meal = st.meals[mealId];
    ui.ingMealId = mealId; ui.ingBack = from; ui.ingName = meal.name; ui.ingSearch = '';
    ui.ingSel = meal.ing.map(function (p) { return [p[0], p[1]]; });
    go('ing', -1);
  }

  function selN(id) { for (var i = 0; i < ui.ingSel.length; i++) { if (ui.ingSel[i][0] === id) { return ui.ingSel[i]; } } return null; }

  function rIng() {
    if (!st.meals[ui.ingMealId]) { go('main'); return; }
    var sel = ui.ingSel.filter(function (p) { return st.items[p[0]]; })
      .sort(function (a, b) { return st.items[a[0]].name.localeCompare(st.items[b[0]].name); });
    $('ingChosen').innerHTML = '<div class="sechead"><h3>In This Meal</h3><span>' + sel.length + '</span></div>' + (sel.length ? sel.map(function (p) {
      var id = p[0], name = st.items[id].name;
      var right = ui.rmArmed === id
        ? '<button class="rmpill" data-act="ingRm" data-id="' + id + '" aria-label="Tap Again To Remove ' + esc(name) + ' From This Meal">Remove</button>'
        : '<div class="qty' + (ui.hot === id ? ' hot' : '') + '">' +
          '<button class="qb" data-act="ingDec" data-id="' + id + '" aria-label="' + (p[1] <= 1 ? 'Remove ' : 'One Less ') + esc(name) + '">' + I.dec + '</button>' +
          '<span class="qn' + (p[1] > 1 ? ' many' : '') + '">' + p[1] + '</span>' +
          '<button class="qb up" data-act="ingInc" data-id="' + id + '" aria-label="One More ' + esc(name) + '">' + I.incG + '</button></div>';
      return '<div class="row"><button class="rowmain" data-act="ingToggle" data-id="' + id + '"><span class="box on" aria-hidden="true">' + I.check + '</span><span class="nm">' + esc(name) + '</span></button>' + right + '</div>';
    }).join('') : '<div class="empty">Tap Items Below To Add Them</div>');
    $('deleteMealBtn').textContent = armed('delMeal') ? 'Tap Again To Delete Meal' : 'Delete Meal';
    $('deleteMealBtn').classList.toggle('armed', armed('delMeal'));
    rIngAll();
  }

  function rIngAll() {
    var ids = Object.keys(st.items).filter(function (id) { return !selN(id); })
      .sort(function (a, b) { return st.items[a].name.localeCompare(st.items[b].name); });
    $('ingAll').innerHTML = '<div class="sechead"><h3>All Items</h3><span>' + ids.length + '</span></div>' + ids.map(function (id) {
      return '<button class="listbtn" data-act="ingToggle" data-id="' + id + '"><span class="box" aria-hidden="true"></span><span class="grow">' + esc(st.items[id].name) + '</span></button>';
    }).join('');
    rIngSuggest();
  }

  function rIngSuggest() {
    var box = $('ingSuggest');
    if (!box) { return; }
    var q = GL.norm(ui.ingSearch);
    var ids = q ? rankItems(Object.keys(st.items), q) : [];
    var room = Math.floor(($('ingCtrl').getBoundingClientRect().top - 16) / 49);
    ids = ids.slice(0, Math.max(2, Math.min(5, room)));
    if (!ids.length) { box.classList.add('hide'); box.innerHTML = ''; return; }
    box.classList.remove('hide');
    box.innerHTML = ids.map(function (id) {
      var inMeal = !!selN(id);
      return '<button class="sugg" type="button" data-act="ingSugg" data-id="' + id + '"><span>' + esc(st.items[id].name) + '</span>' +
        '<span class="tag' + (inMeal ? '' : ' go') + '">' + (inMeal ? 'In Meal · Add 1 More' : 'Add') + '</span></button>';
    }).join('');
  }

  /* --- settings --- */
  function rThemes() {
    var t = prefs.theme || { id: 'midnight' };
    var html = '<div class="themes">' + THEMES.map(function (x) {
      return '<button class="theme' + (t.id === x.id ? ' on' : '') + '" data-act="theme" data-id="' + x.id + '" aria-label="' + x.name + ' Colors">' +
        '<span class="dot" style="background:' + x.bg + '"><i style="background:' + x.accent + '"></i></span>' + x.name + '</button>';
    }).join('') +
      '<button class="theme' + (t.id === 'shuffle' ? ' on' : '') + '" data-act="theme" data-id="shuffle" aria-label="Shuffle The Looks Each Time">' +
      '<span class="dot" style="background:conic-gradient(#0B1622 0 25%,#17111C 0 50%,#1A1210 0 75%,#1C1216 0)"><i style="background:conic-gradient(#4FB3FF 0 25%,#C792EA 0 50%,#FF9F5A 0 75%,#FF7AA8 0)"></i></span>Shuffle</button>' +
      '<button class="theme' + (t.id === 'mix' ? ' on' : '') + '" data-act="theme" data-id="mix" aria-label="A New Color Mix Each Time">' +
      '<span class="dot" style="background:conic-gradient(from 30deg,#1E1430,#10202A,#1E2614,#2A1A12,#1E1430)"><i style="background:conic-gradient(#FF7AA8,#FFD166,#7BE08A,#4FB3FF,#C792EA,#FF7AA8)"></i></span>New Mix</button>' +
      '</div>';
    if (isSurprise(t) && sessionLook) {
      html += '<div class="custom"><div class="textrow"><span>This Time: <b style="color:var(--text)">' + esc(sessionLook.name) + '</b></span>' +
        '<span style="display:flex;gap:6px"><button class="link" data-act="anotherLook">Try Another</button><button class="link" data-act="keepLook">Keep This</button></span></div>' +
        (t.id === 'shuffle' ? '<button class="switchrow setrow" data-act="lightLooks" role="switch" aria-checked="' + !!t.light + '" style="min-height:44px;font-size:14px;color:var(--muted)"><span>Include Light Looks</span>' +
          '<span class="sw' + (t.light ? ' on' : '') + '" aria-hidden="true"><i></i></span></button>' : '') +
        '<div class="sub" style="font-size:13px">A New Look Each Time You Open The App</div></div>';
    }
    var cur = THEMES.filter(function (x) { return x.id === t.id; })[0];
    var cbg = t.id === 'custom' ? t.bg : (isSurprise(t) && sessionLook ? sessionLook.bg : (cur || THEMES[0]).bg);
    var cac = t.id === 'custom' ? t.accent : (isSurprise(t) && sessionLook ? sessionLook.accent : (cur || THEMES[0]).accent);
    var mode = t.id === 'custom' ? (t.text || 'auto') : 'auto';
    html += '<div class="custom"><h4>' + (t.id === 'custom' ? 'Custom Colors' : 'Make Your Own') + '</h4><div class="pickers">' +
      '<label class="picker"><input type="color" data-theme="bg" value="' + cbg.toLowerCase() + '">Background</label>' +
      '<label class="picker"><input type="color" data-theme="accent" value="' + cac.toLowerCase() + '">Highlight</label></div>' +
      '<div class="textrow"><span>Text Color</span><div class="seg sm three-sm">' +
      ['auto', 'light', 'dark'].map(function (m) {
        return '<button data-act="textMode" data-mode="' + m + '" class="' + (mode === m && t.id === 'custom' ? 'on' : (m === 'auto' && t.id !== 'custom' ? 'on' : '')) + '">' + ({ auto: 'Auto', light: 'Light', dark: 'Dark' })[m] + '</button>';
      }).join('') + '</div></div></div>';
    $('themeCard').innerHTML = html;
  }

  function customFrom() {
    var t = prefs.theme || {};
    if (t.id === 'custom') { return { id: 'custom', bg: t.bg, accent: t.accent, text: t.text || 'auto' }; }
    if (isSurprise(t) && sessionLook) { return { id: 'custom', bg: sessionLook.bg, accent: sessionLook.accent, text: 'auto' }; }
    var cur = THEMES.filter(function (x) { return x.id === t.id; })[0] || THEMES[0];
    return { id: 'custom', bg: cur.bg, accent: cur.accent, text: 'auto' };
  }
  function setTheme(t, rerender) {
    savePref('theme', t);
    applyTheme(t);
    if (rerender) { render(); }
  }

  function rSyncLog() {
    var log = lsGet('errlog', []) || [];
    var fmt = function (t) { var d = new Date(t); return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' }); };
    $('syncLog').innerHTML = log.length
      ? log.map(function (e) {
          return '<div class="row" style="padding:8px 0;align-items:flex-start"><span class="nm" style="padding:0"><span style="font-size:14px">' + esc(e.kind) + ' · ' + esc(fmt(e.t)) +
            (e.hidden ? ' · In Background' : '') + (e.online === false ? ' · Phone Offline' : '') + '</span><small style="word-break:break-word">' + esc(e.msg) + '</small></span></div>';
        }).join('') + '<button class="link" data-act="clearLog" style="padding:0">Clear</button>'
      : '<div class="empty">No Sync Problems Recorded</div>';
  }

  function rSettings() {
    rThemes();
    rSyncLog();
    $('meName').textContent = me;
    $('secToggle').innerHTML = '<button class="switchrow setrow" data-act="headings" role="switch" aria-checked="' + prefs.headings + '"><span>Show Sections In Store Order</span>' +
      '<span class="sw' + (prefs.headings ? ' on' : '') + '" aria-hidden="true"><i></i></span></button>';
    var n = st.sections.length;
    $('secList').innerHTML = st.sections.map(function (s, i) {
      return '<div class="secrow"><span class="num">' + (i + 1) + '</span><span>' + esc(s) + '</span>' +
        '<button class="arrow" data-act="secUp" data-i="' + i + '" aria-label="Move ' + esc(s) + ' Up"' + (i === 0 ? ' disabled' : '') + '>' + I.up + '</button>' +
        '<button class="arrow" data-act="secDown" data-i="' + i + '" aria-label="Move ' + esc(s) + ' Down"' + (i === n - 1 ? ' disabled' : '') + '>' + I.dn + '</button></div>';
    }).join('');
  }

  /* ---------- taps ---------- */
  var acts = {
    check: function (b) { send({ type: 'check', id: b.dataset.id, on: !st.checked[b.dataset.id], by: me, t: Date.now() }); },
    inc: function (b) { warm(b.dataset.id); send({ type: 'bump', id: b.dataset.id, d: 1 }); },
    dec: function (b) {
      var id = b.dataset.id;
      if ((T[id] || 0) <= 1) { armRemove(id); return; }
      warm(id); send({ type: 'bump', id: id, d: -1 });
    },
    rmItem: function (b) { ui.rmArmed = null; send({ type: 'remove', id: b.dataset.id }); },
    addOpen: function () { ui.addOpen = true; window.scrollTo(0, 0); render(); $('addInput').focus(); },
    addClose: function () { ui.addOpen = false; ui.addText = ''; $('addInput').value = ''; $('addInput').blur(); rSuggest(); render(); },
    mode: function (b) { savePref('mode', b.dataset.mode); render(); },
    reload: function () { window.location.reload(); },
    toTop: function () { window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }); },
    appReset: function () { if (window.APP_RESET) { window.APP_RESET(); } },
    retry: function () { fails = 0; setStatus(''); if (pending.length) { flush(); } else { poll(); } },
    clearLog: function () { lsSet('errlog', []); render(); },
    theme: function (b) {
      var id = b.dataset.id, cur = prefs.theme || {};
      if (isSurprise({ id: id })) { sessionLook = null; }
      setTheme(id === 'shuffle' ? { id: 'shuffle', light: cur.id === 'shuffle' ? !!cur.light : false } : { id: id }, true);
    },
    anotherLook: function () { sessionLook = null; applyTheme(prefs.theme); render(); },
    keepLook: function () {
      if (!sessionLook) { return; }
      setTheme(sessionLook.kind === 'shuffle' ? { id: sessionLook.id } : { id: 'custom', bg: sessionLook.bg, accent: sessionLook.accent, text: 'auto' }, true);
    },
    lightLooks: function () { var t = prefs.theme || {}; sessionLook = null; setTheme({ id: 'shuffle', light: !t.light }, true); },
    textMode: function (b) { var t = customFrom(); t.text = b.dataset.mode; setTheme(t, true); },
    headings: function () { savePref('headings', !prefs.headings); render(); },
    meals: function () { savePref('mealsOpen', !prefs.mealsOpen); render(); },
    clear: function () { if (armed('clear')) { ui.armed = null; send({ type: 'clear' }); } else { arm('clear'); } },
    sugg: function (b) {
      send({ type: 'add', id: b.dataset.id, name: st.items[b.dataset.id].name, qty: GL.parseAdd(ui.addText).qty });
      ui.addText = ''; $('addInput').value = ''; rSuggest(); render();
    },
    all: function () { ui.search = ''; ui.allEdit = false; ui.itemEdit = null; go('all', -1); },
    home: function () { go('main', ui.screen === 'picker' ? -1 : 1); },
    settings: function () { go('settings', -1); },
    toggleList: function (b) {
      var id = b.dataset.id;
      if (T[id]) { send({ type: 'remove', id: id }); } else { send({ type: 'add', id: id, name: st.items[id].name, qty: 1 }); }
    },
    addSearch: function () {
      var p = GL.parseAdd(ui.search);
      if (!p.name) { return; }
      send({ type: 'add', id: uid('i'), name: p.name, qty: p.qty });
      ui.search = ''; $('search').value = ''; rAll();
    },
    allSort: function (b) { savePref('allSort', b.dataset.sort); ui.itemEdit = null; rAll(); window.scrollTo(0, 0); },
    allEdit: function () { ui.allEdit = !ui.allEdit; ui.itemEdit = null; rAll(); },
    itemEdit: function (b) { ui.itemEdit = b.dataset.id; ui.armed = null; rAll(); var n = $('editName'); if (n) { n.focus(); } },
    itemCancel: function () { ui.itemEdit = null; rAll(); },
    itemSave: function (b) {
      var name = GL.titleCase($('editName').value), sec = $('editSec').value;
      ui.itemEdit = null;
      send({ type: 'editItem', id: b.dataset.id, name: name, sec: sec });
    },
    itemDelete: function (b) {
      var key = 'del' + b.dataset.id;
      if (armed(key)) { ui.armed = null; ui.itemEdit = null; send({ type: 'deleteItem', id: b.dataset.id }); } else { arm(key); }
    },
    picker: function () { if (ui.screen === 'main') { ui.mealSearch = ''; } go('picker', 1); },
    newMeal: function () {
      var name = GL.titleCase(ui.mealSearch);
      if (!name) { return; }
      var id = uid('m');
      send({ type: 'newMeal', mealId: id, name: name });
      send({ type: 'addMeal', mealId: id, ticks: {} });
      ui.mealSearch = '';
      go('main', -1);
    },
    pickMeal: function (b) {
      var m = st.meals[b.dataset.id];
      if (!m.ing.length) { send({ type: 'addMeal', mealId: b.dataset.id, ticks: {} }); go('main', -1); return; }
      ui.addMealId = b.dataset.id; ui.ticks = {};
      m.ing.forEach(function (p) { ui.ticks[p[0]] = true; });
      go('addMeal', -1);
    },
    tick: function (b) { var id = b.dataset.id; if (ui.ticks[id]) { delete ui.ticks[id]; } else { ui.ticks[id] = true; } rAddMeal(); },
    confirmAdd: function () { send({ type: 'addMeal', mealId: ui.addMealId, ticks: ui.ticks }); go('main', -1); },
    openMeal: function (b) { ui.viewMealId = b.dataset.id; go('meal', -1); },
    removeMeal: function () { if (armed('rm')) { send({ type: 'removeMeal', mealId: ui.viewMealId }); go('main', 1); } else { arm('rm'); } },
    editIng: function (b) { openIng(b.dataset.from === 'meal' ? ui.viewMealId : ui.addMealId, b.dataset.from); },
    ingBack: function () { go(ui.ingBack === 'addMeal' ? 'addMeal' : ui.ingBack === 'meal' ? 'meal' : ui.ingBack === 'picker' ? 'picker' : 'main', 1); },
    editMeal: function (b) { openIng(b.dataset.id, 'picker'); },
    ingSugg: function (b) {
      var id = b.dataset.id, p = selN(id);
      if (p) { p[1]++; warm(id); } else { ui.ingSel.push([id, 1]); }
      ui.ingSearch = ''; $('ingSearch').value = '';
      rIng();
    },
    ingToggle: function (b) {
      var id = b.dataset.id;
      if (selN(id)) { ui.ingSel = ui.ingSel.filter(function (p) { return p[0] !== id; }); } else { ui.ingSel.push([id, 1]); }
      rIng();
    },
    ingInc: function (b) { var p = selN(b.dataset.id); if (p) { warm(p[0]); p[1]++; rIng(); } },
    ingDec: function (b) {
      var p = selN(b.dataset.id);
      if (!p) { return; }
      if (p[1] <= 1) { armRemove(p[0]); return; }
      warm(p[0]); p[1]--; rIng();
    },
    ingRm: function (b) { var id = b.dataset.id; ui.rmArmed = null; ui.ingSel = ui.ingSel.filter(function (p) { return p[0] !== id; }); rIng(); },
    saveIng: function () {
      var id = ui.ingMealId;
      ui.ingSel.sort(function (a, b) { return (st.items[a[0]] ? st.items[a[0]].name : '').localeCompare(st.items[b[0]] ? st.items[b[0]].name : ''); });
      send({ type: 'saveMeal', mealId: id, name: GL.titleCase(ui.ingName) || st.meals[id].name, ing: ui.ingSel });
      if (ui.ingBack === 'addMeal') {
        ui.ticks = {};
        ui.ingSel.forEach(function (p) { ui.ticks[p[0]] = true; });
        ui.addMealId = id;
        go(ui.ingSel.length ? 'addMeal' : 'picker', 1);
      } else { go(ui.ingBack === 'meal' ? 'meal' : ui.ingBack === 'picker' ? 'picker' : 'main', 1); }
    },
    deleteMeal: function () { if (armed('delMeal')) { send({ type: 'deleteMeal', mealId: ui.ingMealId }); go(ui.ingBack === 'picker' ? 'picker' : 'main', 1); } else { arm('delMeal'); } },
    secUp: function (b) { moveSec(+b.dataset.i, -1); },
    secDown: function (b) { moveSec(+b.dataset.i, 1); },
    changeName: function () { me = ''; lsSet('me', ''); setUrlName(''); built = null; render(); },
    pickName: function (b) { chooseName(b.dataset.name); }
  };

  function moveSec(i, d) {
    var s = st.sections.slice(), j = i + d;
    if (j < 0 || j >= s.length) { return; }
    var t = s[i]; s[i] = s[j]; s[j] = t;
    send({ type: 'setSections', sections: s });
  }

  // Quantity buttons brighten for a few seconds after you use them.
  var warmTimer = null;
  // Tapping − at 1 turns the buttons into a red Remove for 3 seconds; tap it to take the item off the list.
  var rmTimer = null;
  function armRemove(id) {
    ui.rmArmed = id;
    clearTimeout(rmTimer);
    rmTimer = setTimeout(function () { if (ui.rmArmed === id) { ui.rmArmed = null; render(); } }, 3000);
    render();
  }

  function warm(id) {
    ui.hot = id;
    clearTimeout(warmTimer);
    warmTimer = setTimeout(function () { ui.hot = null; render(); }, 3000);
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (ui.rmArmed && (!b || (b.dataset.act !== 'rmItem' && b.dataset.act !== 'ingRm'))) {
      ui.rmArmed = null;
      if (!b || b.dataset.act === 'check' || b.dataset.act === 'ingToggle') { render(); return; }
    }
    if (!b || b.disabled || animating) { return; }
    var fn = acts[b.dataset.act];
    if (!fn) { return; }
    e.preventDefault();
    fn(b);
  });

  document.addEventListener('input', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-theme');
    if (!k) { return; }
    var t = customFrom(); t[k] = e.target.value.toUpperCase();
    prefs.theme = t; applyTheme(t);
  });
  document.addEventListener('change', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-theme');
    if (!k) { return; }
    var t = customFrom(); t[k] = e.target.value.toUpperCase();
    setTheme(t, true);
  });

  /* ---------- swipes: main ⇄ Add Meal (swipe right), main ⇄ All Items (swipe left) ---------- */
  function swipeTarget(screen, dx) {
    if (screen === 'main') { return dx > 0 ? 'picker' : 'all'; }
    if (screen === 'picker' && dx < 0) { return 'main'; }
    if (screen === 'all' && dx > 0) { return 'main'; }
    return null;
  }
  var sw = null;
  document.addEventListener('touchstart', function (e) {
    sw = null;
    var screen = me ? ui.screen : 'name';
    if (animating || e.touches.length !== 1 || ['main', 'picker', 'all'].indexOf(screen) === -1) { return; }
    if (e.target.closest('input, select, textarea, .editor')) { return; }
    var t = e.touches[0];
    sw = { x: t.clientX, y: t.clientY, t: Date.now(), lock: null, dx: 0, screen: screen };
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (!sw) { return; }
    var t = e.touches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
    if (!sw.lock) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) { return; }
      sw.lock = Math.abs(dx) > Math.abs(dy) * 1.3 ? 'h' : 'v';
    }
    if (sw.lock !== 'h') { return; }
    e.preventDefault();
    sw.dx = dx;
    var eff = swipeTarget(sw.screen, dx) ? dx : dx * 0.2;
    var app = $('app');
    app.style.transition = 'none';
    app.style.transform = 'translateX(' + eff + 'px)';
    app.style.opacity = String(1 - Math.min(0.6, Math.abs(eff) / window.innerWidth * 0.9));
  }, { passive: false });
  function endSwipe() {
    if (!sw) { return; }
    var s = sw; sw = null;
    if (s.lock !== 'h') { return; }
    var app = $('app'), w = window.innerWidth;
    var speed = Math.abs(s.dx) / Math.max(1, Date.now() - s.t);
    var target = swipeTarget(s.screen, s.dx);
    if (target && (Math.abs(s.dx) > w * 0.28 || (speed > 0.5 && Math.abs(s.dx) > 40))) {
      if (target === 'all') { ui.search = ''; ui.allEdit = false; ui.itemEdit = null; }
      if (target === 'picker') { ui.mealSearch = ''; }
      if (target === 'main') { }
      go(target, s.dx > 0 ? 1 : -1);
    } else {
      app.style.transition = 'transform 200ms cubic-bezier(0,0,.2,1), opacity 200ms';
      app.style.transform = 'translateX(0)';
      app.style.opacity = '1';
      setTimeout(function () { if (!animating) { app.style.transition = ''; app.style.transform = ''; app.style.opacity = ''; } }, 210);
    }
  }
  document.addEventListener('touchend', endSwipe);
  document.addEventListener('touchcancel', endSwipe);

  // Back To Top button: shows once you've scrolled well down a long list.
  function checkTop() {
    var hide = window.scrollY < 700 || !!ui.addOpen;
    $('toTop').classList.toggle('hide', hide);
    document.body.classList.toggle('topbtn', !hide);
  }
  window.addEventListener('scroll', checkTop, { passive: true });

  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    // Surprise Me: coming back to the app after 10 minutes or more counts as opening it again.
    if (isSurprise(prefs.theme) && hiddenAt && Date.now() - hiddenAt > 10 * 60 * 1000) { sessionLook = null; applyTheme(prefs.theme); render(); }
    if (!document.hidden) { fails = 0; polling = false; if (pending.length) { flush(); } else { poll(); } }
  });
  setInterval(poll, 2500);

  function start(json) {
    if (server) { return; }
    server = JSON.parse(json);
    remember(json);
    pending = lsGet('pending', []) || [];
    recompute();
    // If this phone's name never made it into the shared list (e.g. an earlier save failed), add it now.
    if (me && st.users.indexOf(me) === -1) { send({ type: 'addUser', name: me }); }
    if (me) { loadPrefs(); if (!URL_ME) { setUrlName(me); } }
    render();
    flush();
  }

  // The list normally arrives with the page. If it didn't, ask for it, and keep asking until it comes.
  function fetchStart(attempt) {
    if (server) { return; }
    var tries = attempt || 1;
    var timer = setTimeout(function () {
      if (server) { return; }
      $('app').innerHTML = '<div class="loading">Still Loading…<br><button class="link" data-act="reload">Tap To Try Again</button></div>';
      fetchStart(tries + 1);
    }, 10000);
    google.script.run
      .withSuccessHandler(function (json) { clearTimeout(timer); if (json) { start(json); } })
      .withFailureHandler(function (err) {
        clearTimeout(timer);
        logError('Load', String((err && err.message) || '(No Message)'));
        $('app').innerHTML = '<div class="loading">Couldn\'t Load The List Yet. Trying Again…<br><small>' + esc(err && err.message) + '</small>' +
          (window.APP_RESET ? '<br><br><button class="link" data-act="appReset">Use A Different Setup Code</button>' : '') + '</div>';
        setTimeout(function () { fetchStart(tries + 1); }, 2500);
      })
      .getState(0);
  }

  // Start from the list that came with the page; or, in the phone app, from the last copy kept on the phone
  // (so it opens instantly, even with no signal) and then catch up.
  var lastCopy = lsGet('lastState', '');
  if (BOOT) { try { start(BOOT); } catch (e) { server = null; fetchStart(); } }
  else if (lastCopy) { try { start(lastCopy); setTimeout(poll, 50); } catch (e) { server = null; fetchStart(); } }
  else { fetchStart(); }
})();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
</body>
